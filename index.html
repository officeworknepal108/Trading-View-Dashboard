    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          const originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          let _currentFetch = originalFetch;

          Object.defineProperty(window, 'fetch', {
            get() {
              return _currentFetch;
            },
            set(newFetch) {
              _currentFetch = typeof newFetch === 'function' ? newFetch : originalFetch;
            },
            configurable: true,
            enumerable: true
          });

          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', {
                get() {
                  return _currentFetch;
                },
                set(newFetch) {
                  _currentFetch = typeof newFetch === 'function' ? newFetch : originalFetch;
                },
                configurable: true,
                enumerable: true
              });
            } catch (_) {}
          }
        } catch (e) {
          console.warn('Fetch setter initialization:', e);
        }
      })();
    </script>
